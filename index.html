<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts League Scoreboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 10px; }
        .scoreboard { display: flex; justify-content: space-around; text-align: center; margin: 20px 0; }
        .player-box { background: #3d3d3d; padding: 20px; border-radius: 8px; width: 40%; }
        .score { font-size: 5rem; font-weight: bold; color: #00ffcc; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 20px auto; }
        button { padding: 15px; font-size: 1.2rem; background: #444; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #555; }
        .action-btn { background: #00aa66; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Match 1 of 16: Singles (501 - Best of 3 Legs)</h2>
        <div class="scoreboard">
            <div class="player-box">
                <h3 id="p1-name">Player A</h3>
                <div class="score" id="p1-score">501</div>
                <div>Legs: <span id="p1-legs">0</span></div>
            </div>
            <div class="player-box">
                <h3 id="p2-name">Player B</h3>
                <div class="score" id="p2-score">501</div>
                <div>Legs: <span id="p2-legs">0</span></div>
            </div>
        </div>

        <div class="keypad">
            <button onclick="addScore(1)">1</button>
            <button onclick="addScore(2)">2</button>
            <button onclick="addScore(3)">3</button>
            <button onclick="addScore(4)">4</button>
            <button onclick="addScore(5)">5</button>
            <button onclick="addScore(6)">6</button>
            <button onclick="addScore(7)">7</button>
            <button onclick="addScore(8)">8</button>
            <button onclick="addScore(9)">9</button>
            <button onclick="clearScore()">Clear</button>
            <button onclick="addScore(0)">0</button>
            <button class="action-btn" onclick="submitScore()">Enter</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
